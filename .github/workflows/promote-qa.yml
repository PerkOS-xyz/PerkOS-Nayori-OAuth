name: Promote exact main commit to QA

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact 40-character commit SHA already merged into main
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: qa-promotion
  cancel-in-progress: false

jobs:
  verify-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nayori_oauth_test
          POSTGRES_PASSWORD: nayori-test
          POSTGRES_USER: nayori_oauth
        options: >-
          --health-cmd "pg_isready -U nayori_oauth -d nayori_oauth_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      TEST_DATABASE_URL: postgresql://nayori_oauth:nayori-test@127.0.0.1:5432/nayori_oauth_test
    steps:
      - name: Check out main with complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: main

      - name: Validate requested promotion
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          printf '%s' "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          git fetch origin main qa
          git cat-file -e "$RELEASE_SHA^{commit}"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          git merge-base --is-ancestor origin/qa "$RELEASE_SHA"

      - name: Check out the exact release commit
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        run: git checkout --detach "$RELEASE_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release gates
        run: |
          npm run verify
          npm audit --audit-level=high

      - name: Promote the verified SHA without force
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        run: git push origin "$RELEASE_SHA:refs/heads/qa"

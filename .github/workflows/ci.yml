name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nayori_oauth_test
          POSTGRES_PASSWORD: nayori-test
          POSTGRES_USER: nayori_oauth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nayori_oauth -d nayori_oauth_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://nayori_oauth:nayori-test@127.0.0.1:5432/nayori_oauth_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm audit --audit-level=high
